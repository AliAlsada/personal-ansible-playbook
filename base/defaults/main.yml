---
config_directory: /home/{{ username }}/.config
picom_config_directory: "{{ config_directory }}/picom"

essential_packages_apt:
  - git
  - btop
  - vlc
  - feh
  - thunar
  - xclip 
  - network-manager
  - pavucontrol
  - pulseaudio
  - pamixer # sound
  - ansible
  - dmenu
  - rofi # apps manager
  - ncdu # Disk space
  - imagemagick
  - blueman
  - arandr
  - virt-manager
  - bluez
  - ddcutil
  - virtualbox
  - pipx
  - picom
  - redshift
  - i3lock
  - scrot

essential_packages_pipx: []

fonts:
  - name: nerd-fonts
    url: https://github.com/ryanoasis/nerd-fonts/releases

picom_opacity_rule:
  kitty: 95
  nvim: 95
  Code: 95
  firefox: 100

monitors:
  - name: asus
    refresh_rate: "239.97"
    resolution:  2560x1440
    output: DP-1

  - name: benq
    frames: "144.00"
    resolution:  2560x1440
    output: HDMI-0
